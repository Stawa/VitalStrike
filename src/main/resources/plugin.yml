name: VitalStrike
version: "${version}"
main: stawa.vitalstrike.VitalStrike
api-version: "26.1"
author: stawa
description: Floating damage indicators, combos, statistics and a knockdown/revive system.
website: https://github.com/Stawa/VitalStrike

commands:
  vitalstrike:
    description: Main VitalStrike command
    usage: /<command> help
    aliases: [vs]
    permission: vitalstrike.use
    permission-message: You don't have permission to use VitalStrike commands!

permissions:
  vitalstrike.use:
    description: Allows using the /vitalstrike command
    default: true
  vitalstrike.toggle:
    description: Toggle your own damage indicators
    default: true
  vitalstrike.stats:
    description: View combat statistics
    default: true
  vitalstrike.leaderboard:
    description: View the leaderboards
    default: true
  vitalstrike.hologram:
    description: Toggle your combo hologram
    default: true
  vitalstrike.resourcepack:
    description: Load the optional resource pack
    default: true
  vitalstrike.reload:
    description: Reload the configuration
    default: op
  vitalstrike.clear:
    description: Remove all floating damage and combo text
    default: op
  vitalstrike.give:
    description: Give Vital Awakening items
    default: op
  vitalstrike.revive:
    description: Force-revive a downed player
    default: op
  vitalstrike.admin.permissions:
    description: Manage stored group permissions with /vs perm
    default: op
  vitalstrike.update-notify:
    description: Get told about new releases when joining
    default: op
  vitalstrike.admin:
    description: All VitalStrike administration permissions
    default: op
    children:
      vitalstrike.reload: true
      vitalstrike.clear: true
      vitalstrike.give: true
      vitalstrike.revive: true
      vitalstrike.admin.permissions: true
      vitalstrike.update-notify: true
