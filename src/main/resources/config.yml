# ===============================
# VitalStrike Configuration File
# Developed by Stawa
# ===============================

# Set to 'false' to completely disable VitalStrike features.
enabled: true

# Update Checker Settings.
update-checker:
  # Should the plugin check for updates on startup?
  enabled: true

# Database settings for storing player data (e.g., stats, preferences).
database:
  enabled: true
  file: "playerdata.yml"

# Settings for how damage indicators appear, animate, and behave.
display:
  # How long (in seconds) the damage indicator stays visible.
  duration: 1.5

  # Position offsets relative to the entity that took damage.
  position:
    # Vertical offset. Negative values move it down, positive values move it up.
    y: -0.2

    # Horizontal offset. Negative values move it left, positive values move it right.
    x: -0.5

    # Random position variation to prevent stacking.
    # Set to -1 to disable random offset.
    # Set to 0 or higher (e.g., 0.5) to enable random scattering.
    random-offset: -1

    # Direction the indicator moves during animation.
    # Valid values: "down", "up", "left", "right"
    direction: "down"

  # Animation settings for the indicators.
  animation:
    # How long (in seconds) it takes for the text to fade in.
    fade-in: 0.25

    # How long (in seconds) it takes for the text to fade out.
    fade-out: 0.25

    # The speed at which the indicator floats (blocks per tick).
    float-speed: 0.03

    # The intensity of the curve effect during movement.
    float-curve: 0.02

  # Damage Merging System
  # Merges multiple damage events into a single indicator if they happen quickly.
  # This prevents spamming indicators when an entity takes rapid damage (e.g., lava, cactus).
  merge:
    # Enable or disable damage merging.
    enabled: true

    # Time window in milliseconds to merge damage events.
    # 2000ms = 2 seconds.
    window: 2000

# Select which format system to use for displaying damage.
# Options: "simple-damage-formats" (uses the list below) or "group-damage-formats".
damage-indicator: "simple-damage-formats"

# ------------------------------------------------------------------------------
# Simple Damage Formats
# ------------------------------------------------------------------------------
# Define the text format for different damage types.
# You can use MiniMessage format (e.g., <red>, <gradient:red:blue>) or Legacy colors (&c).
# The placeholder '%.1f' represents the damage amount.
simple-damage-formats:
  default: "<gradient:#FF6B6B:#FF8787>-%.1f ❤</gradient>"
  critical: "<bold><gradient:#FF0000:#8B0000>-%.1f ⚡</gradient></bold>"
  poison: "<gradient:#50C878:#228B22>-%.1f ☠</gradient>"
  fire: "<gradient:#FFD700:#FF4500>-%.1f 🔥</gradient>"
  magic: "<gradient:#9400D3:#800080>-%.1f ✨</gradient>"
  fall: "<gradient:#A9A9A9:#696969>-%.1f 💨</gradient>"
  drown: "<gradient:#1E90FF:#0000CD>-%.1f 💧</gradient>"
  explosion: "<gradient:#FF4500:#8B0000>-%.1f 💥</gradient>"
  heal: "<green>+%.1f ❤"
  contact: "<green>-%.1f 🌵"
  cramming: "<gray>-%.1f 📦"
  dragon: "<dark_purple>-%.1f 🐉"
  dryout: "<yellow>-%.1f 🌊"
  sweep: "<red>-%.1f ⚔"
  falling_block: "<gray>-%.1f 🧱"
  wall: "<gray>-%.1f 💫"
  freeze: "<aqua>-%.1f ❄"
  hot_floor: "<gold>-%.1f 🔥"
  lava: "<dark_red>-%.1f 🌋"
  lightning: "<yellow>-%.1f ⚡"
  projectile: "<gray>-%.1f 🏹"
  sonic_boom: "<dark_aqua>-%.1f 📢"
  starvation: "<gold>-%.1f 🍖"
  suffocation: "<gray>-%.1f ⬛"
  thorns: "<green>-%.1f 🌹"
  void: "<dark_gray>-%.1f ⬇"
  wither: "<dark_gray>-%.1f 💀"
  border: "<red>-%.1f 🌐"

# Define different damage formats based on player permissions.
# This allows VIPs or specific ranks to have unique damage indicators.
group-damage-formats:
  # Default group for players without specific permissions.
  default:
    use-simple-formats: true
    damage-formats:
      default: "<gradient:#FF6B6B:#FF8787>-%.1f ❤</gradient>"
      critical: "<bold><gradient:#FF0000:#8B0000>-%.1f ⚡</gradient></bold>"
      poison: "<gradient:#50C878:#228B22>-%.1f ☠</gradient>"

  # Example group: Water element style.
  # Permission required: vitalstrike.group.water
  water:
    permission: "vitalstrike.group.water"
    damage-formats:
      default: "<gradient:#1E90FF:#00BFFF>-%.1f 💧</gradient>"
      critical: "<bold><gradient:#0000FF:#000080>-%.1f 🌊</gradient></bold>"
      poison: "<gradient:#4169E1:#1E90FF>-%.1f ⚓</gradient>"
      fire: "<gradient:#1E90FF:#00BFFF>-%.1f 💨</gradient>"

  # Example group: Fire element style.
  # Permission required: vitalstrike.group.fire
  fire:
    permission: "vitalstrike.group.fire"
    damage-formats:
      default: "<gradient:#FF4500:#FF8C00>-%.1f 🔥</gradient>"
      critical: "<bold><gradient:#FF0000:#8B0000>-%.1f ⚔</gradient></bold>"
      poison: "<gradient:#FF6347:#FF4500>-%.1f ☄</gradient>"
      fire: "<gradient:#FF4500:#FF8C00>-%.1f 🌋</gradient>"

# Sounds played when specific damage types occur.
# Use standard Minecraft sound names.
damage-type-sounds:
  entity_attack: "entity.player.attack.strong"
  critical: "entity.player.attack.crit"
  poison: "entity.spider.hurt"
  fire: "block.fire.ambient"
  fire_tick: "block.fire.ambient"
  kill: "entity.player.death"
  magic: "entity.illusioner.cast_spell"
  fall: "entity.player.small_fall"
  drowning: "block.water.ambient"
  block_explosion: "entity.generic.explode"
  entity_explosion: "entity.generic.explode"
  contact: "block.grass.break"
  cramming: "entity.player.hurt"
  dragon_breath: "entity.ender_dragon.growl"
  dryout: "block.water.ambient"
  entity_sweep_attack: "entity.player.attack.sweep"
  falling_block: "block.stone.break"
  fly_into_wall: "entity.player.hurt"
  freeze: "block.glass.break"
  hot_floor: "block.fire.ambient"
  lava: "block.lava.ambient"
  lightning: "entity.lightning_bolt.thunder"
  projectile: "entity.arrow.hit"
  sonic_boom: "entity.warden.sonic_boom"
  thorns: "block.sweet_berry_bush.hurt"
  void: "entity.player.hurt"
  wither: "entity.wither.ambient"
  world_border: "entity.elder_guardian.curse"

# Settings to control where the plugin is active and how it behaves in different worlds.
world-settings:
  # Enable per-world settings.
  enabled: true

  # List of worlds where damage indicators are completely disabled.
  disabled-worlds:
    - "example_world"
    - "minigames_world"

  # Dimension-specific damage multipliers.
  # You can adjust how much damage is dealt in different environments.
  dimensions:
    overworld:
      enabled: true
      # 1.0 = 100% (Normal Damage)
      damage-multiplier: 1.0
    nether:
      enabled: true
      # 1.2 = 120% (20% more damage)
      damage-multiplier: 1.2
    end:
      enabled: true
      # 1.1 = 110% (10% more damage)
      damage-multiplier: 1.1

  # Integration with WorldGuard regions.
  # If true, indicators will respect PVP flags in regions.
  respect-worldguard-pvp: true

# Settings for the combo tracking and display system.
combo:
  # Enable the combo system.
  enabled: true

  # Time in seconds before the combo resets if no new hit occurs.
  reset-time: 3

  # Combo Decay Settings
  # Instead of instantly resetting, combos can gradually lose points.
  decay:
    # Enable combo decay.
    enabled: false

    # Seconds of inactivity before decay starts.
    time: 10

    # How many points are lost per decay interval.
    rate: 1

    # Interval (in seconds) between decay ticks.
    interval: 1

    # Minimum combo points to retain (decay stops at this value).
    minimum: 0

  # Damage Multiplier Settings
  # Increase damage output based on the current combo count.
  multiplier:
    # Enable damage multiplier based on combos.
    enabled: false

    # Base multiplier (starting point).
    base: 1.0

    # Damage increase per combo point (0.1 = +10%).
    per-combo: 0.1

    # Maximum damage multiplier cap (3.0 = 300%).
    max: 3.0

    # Specific multipliers for reaching certain ranks.
    ranks:
      D: 1.0
      C: 1.2
      B: 1.5
      A: 1.8
      S: 2.2
      SS: 2.6
      SSS: 3.0

  # Visual Display Settings for Combos.
  display:
    # Format of the combo message displayed to the player.
    # %d = combo count.
    format: "<bold><gradient:#FF0000:#FFD700>✦ %dx COMBO ✦</gradient></bold>"

    # Format for the multiplier display (if enabled).
    multiplier-format: " <gray>(<gradient:#FFD700:#FFA500>%.1fx</gradient>)</gray>"

    # Warning message when combo is about to decay.
    decay-warning: "<italic><gray>(Decaying in %.1fs)</gray></italic>"

    # Rank Display Settings
    rank:
      # Enable rank display alongside combo.
      enabled: true

      # Format for the rank display. %s = rank name.
      format: " <bold><gradient:#00FF00:#00FFFF>[%s]</gradient></bold>"

      # Combo thresholds required to reach each rank.
      thresholds:
        D: 0
        C: 5
        B: 10
        A: 15
        S: 25
        SS: 40
        SSS: 60

      # Color definitions for each rank.
      colors:
        D: "<gradient:#808080:#A0A0A0>"
        C: "<gradient:#00FF00:#90EE90>"
        B: "<gradient:#00FFFF:#87CEEB>"
        A: "<gradient:#FFD700:#FFA500>"
        S: "<gradient:#FF69B4:#FF1493>"
        SS: "<gradient:#9400D3:#8A2BE2>"
        SSS: "<gradient:#FF0000:#FF4500>"

  # Effects: Sounds and Particles for Combos.
  effects:
    # Enable effects.
    enabled: true

    # Sound settings.
    sound:
      enabled: true
      # Sound played when combo increases.
      combo-up: "entity.experience_orb.pickup"
      # Sound played when a rank milestone is reached.
      combo-milestone: "entity.player.levelup"
      volume: 1.0
      pitch: 1.0

    # Particle settings.
    particles:
      enabled: true
      type: "CRIT"
      count: 10

  # Hologram: Floating text for high combos.
  hologram:
    # Enable hologram display for combos.
    enabled: true

    # Minimum combo required to spawn a hologram.
    min-combo: 10

    # Duration (in seconds) the hologram stays.
    duration: 3.0

    # Height offset above the player.
    height: 2.0

    # Text format for the hologram.
    format: "<gradient:red:gold><bold>COMBO STREAK!</bold></gradient>"

# Settings for the knockdown and revival mechanics.
knockdown-system:
  # Enable the knockdown system.
  enabled: true

  # How long (in seconds) a player stays in the downed state before dying.
  down-duration: 30

  # Amount of health a player has while downed.
  downed-health: 20.0

  # Revival Settings (being revived by others).
  external-revive:
    # Does the reviver need the 'Vital Awakening' item?
    require-vital-awakening: false

    # Maximum distance to revive a player.
    range: 3.0

    # Time (in seconds) it takes to revive someone.
    duration: 5.0

  # Settings for the 'Vital Awakening' item (self-revive or instant revive).
  vital-awakening:
    # Is the item instant use?
    instant-use: false

    # Time (in seconds) to use the item.
    use-duration: 4.0

  # Visual and Audio Effects for Knockdown/Revival.
  effects:
    # Chat messages for various states.
    messages:
      cannot-revive: "<red>You cannot revive this player right now."
      revive-failed: "<red>Revival failed! Stay closer to the player."
      revive-complete: "<green>You have been revived by %player%!"
      self-revived: "<green>You used Vital Awakening to revive yourself!"
      being-revived: "<yellow>Being revived by %player%..."
      reviving-player: "<yellow>Reviving %player%..."
      downed: "<red>You have been knocked down! Wait for help or death in %time% seconds"

    # Boss Bar settings during revival.
    boss-bar:
      reviving:
        color: "YELLOW"
        style: "SOLID"
        title: "<yellow>Reviving %player%..."
      being-revived:
        color: "YELLOW"
        style: "SOLID"
        title: "<yellow>Being revived by %player%..."

    # Potion effects applied to the downed player.
    down:
      slowness: 255
      blindness: 1

    # Effects displayed on the reviver.
    reviver:
      show_bossbar: true
      particle_effect: "HEART"
      sound_effect: "block.note_block.chime"

# Settings for player rewards based on damage dealt.
rewards:
  # Enable the reward system.
  enabled: true

  # Define reward tiers based on total damage dealt.
  tiers:
    - damage: 50.0
      xp: 10
      items:
        - material: "IRON_INGOT"
          amount: 3
    - damage: 100.0
      xp: 50
      items:
        - material: "DIAMOND"
          amount: 1
        - material: "GOLDEN_APPLE"
          amount: 1
    - damage: 200.0
      xp: 100
      items:
        - material: "NETHERITE_SCRAP"
          amount: 1

# Leaderboard Display Settings.
leaderboard:
  # Default leaderboard type (damage, combo, average).
  default-type: "damage"

  # Number of players to show on the leaderboard.
  display-limit: 10

  # Visual formatting for the leaderboard.
  display:
    header: "<dark_gray><strikethrough>                    </strikethrough>"
    footer: "<dark_gray><strikethrough>                    </strikethrough>"
    entry-format: "<yellow>#%d <white>%s: <gold>%s"
    title-formats:
      damage: "<gold><bold>Top %d Damage Dealers</bold></gold>"
      combo: "<gold><bold>Top %d Highest Combos</bold></gold>"
      average: "<gold><bold>Top %d Average Damage</bold></gold>"

  # Number formatting for values.
  number-format:
    damage: "%.1f"
    average: "%.1f"
    combo: "%d"

# Resource Pack Settings (Optional)
resource-pack:
  # Automatically send the resource pack on join?
  auto-send: false

  # Hint message settings.
  hint:
    enabled: true
    message: "<yellow>You can use <click:suggest_command:/vs resourcepack>/vs resourcepack</click> or <click:suggest_command:/vs rp>/vs rp</click> to load the resource pack!"

# General Plugin Messages
messages:
  no-permission: "<red>You don't have permission to use this command!"
  enabled-personal: "<green>VitalStrike damage indicators enabled for you!"
  disabled-personal: "<red>VitalStrike damage indicators disabled for you!"
  already-enabled: "<yellow>VitalStrike damage indicators are already enabled for you!"
  already-disabled: "<yellow>VitalStrike damage indicators are already disabled for you!"
  config-reloaded: "<green>Configuration reloaded successfully!"
